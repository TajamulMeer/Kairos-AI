version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airix_postgres_dev
    environment:
      POSTGRES_DB: airix_db_dev
      POSTGRES_USER: airix_user
      POSTGRES_PASSWORD: airix_dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: airix_redis_dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: airix_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
